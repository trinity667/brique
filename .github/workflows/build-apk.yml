name: Build and publish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=API_URL=https://briques-paie-kfin.onrender.com 2>&1 | tee build-apk-ci.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: build-apk-ci.log
          if-no-files-found: ignore

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Briques Paie APK ${GITHUB_RUN_NUMBER}" \
            --notes "APK compilé avec l'API Render https://briques-paie-kfin.onrender.com"
